name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: backendkit, POSTGRES_USER: backendkit, POSTGRES_PASSWORD: backendkit }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U backendkit -d backendkit"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: [6379:6379]
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: backendkit
      DB_USERNAME: backendkit
      DB_PASSWORD: backendkit
      REDIS_HOST: localhost
      JWT_SECRET: '01234567890123456789012345678901'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

