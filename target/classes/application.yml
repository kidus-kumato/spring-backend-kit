spring:
  application.name: ${APP_NAME:spring-backend-kit}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backendkit}
    username: ${DB_USERNAME:backendkit}
    password: ${DB_PASSWORD:backendkit}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null
server:
  forward-headers-strategy: framework
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.show-details: when_authorized
  health.redis.enabled: true
app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-chars}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:900}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs
logging:
  pattern.level: '%5p [traceId:%X{traceId}]'
